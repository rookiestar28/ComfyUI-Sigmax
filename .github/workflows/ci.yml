name: Foundation CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.10"
          - "3.13"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # pragma: allowlist secret

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # pragma: allowlist secret
        with:
          python-version: ${{ matrix.python }}

      - name: Create Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run Windows full gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -File scripts/run_full_tests_windows.ps1

      - name: Create Linux environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv .venv-wsl
          .venv-wsl/bin/python -m pip install -e '.[dev]'

      - name: Run Linux full gate
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/run_full_tests_linux.sh

  parity-pinned:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # pragma: allowlist secret

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # pragma: allowlist secret
        with:
          python-version: "3.13"

      - name: Create isolated parity environment
        shell: bash
        run: |
          python -m venv .venv-parity
          .venv-parity/bin/python -m pip install -e '.[dev]'
          .venv-parity/bin/python -m pip install -r requirements/parity-krea2-turbo.txt

      - name: Regenerate pinned Krea 2 Turbo parity report
        shell: bash
        run: |
          .venv-parity/bin/python -m scripts.run_krea2_turbo_parity \
            --output .tmp/krea2_turbo_parity_v1.json

      - name: Verify committed parity evidence
        shell: bash
        run: |
          cmp --silent \
            tests/parity/fixtures/krea2_turbo_parity_v1.json \
            .tmp/krea2_turbo_parity_v1.json

      - name: Publish parity evidence
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # pragma: allowlist secret
        with:
          name: krea2-turbo-parity-python-3.13
          path: .tmp/krea2_turbo_parity_v1.json
          if-no-files-found: warn
          retention-days: 14

  raw-parity-pinned:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # pragma: allowlist secret

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # pragma: allowlist secret
        with:
          python-version: "3.13"

      - name: Create isolated RAW parity environment
        shell: bash
        run: |
          python -m venv .venv-parity
          .venv-parity/bin/python -m pip install -e '.[dev]'
          .venv-parity/bin/python -m pip install -r requirements/parity-krea2-turbo.txt

      - name: Regenerate pinned Krea 2 RAW parity report
        shell: bash
        run: |
          .venv-parity/bin/python -m scripts.run_krea2_raw_parity \
            --output .tmp/krea2_raw_parity_v1.json

      - name: Verify committed RAW parity evidence
        shell: bash
        run: |
          cmp --silent \
            tests/parity/fixtures/krea2_raw_parity_v1.json \
            .tmp/krea2_raw_parity_v1.json

      - name: Publish RAW parity evidence
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # pragma: allowlist secret
        with:
          name: krea2-raw-parity-python-3.13
          path: .tmp/krea2_raw_parity_v1.json
          if-no-files-found: warn
          retention-days: 14

  native-comfyui-parity-pinned:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # pragma: allowlist secret

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # pragma: allowlist secret
        with:
          python-version: "3.13"

      - name: Fetch pinned ComfyUI source
        shell: bash
        run: |
          git init .tmp/ComfyUI
          git -C .tmp/ComfyUI remote add origin https://github.com/Comfy-Org/ComfyUI.git
          git -C .tmp/ComfyUI fetch --depth 1 origin \
            e651b7bef55a5376343dcb1c0edb79f0142c985e  # pragma: allowlist secret
          git -C .tmp/ComfyUI checkout --detach FETCH_HEAD

      - name: Create isolated native parity environment
        shell: bash
        run: |
          python -m venv .venv-comfy-parity
          .venv-comfy-parity/bin/python -m pip install -e '.[dev]'
          .venv-comfy-parity/bin/python -m pip install \
            -r requirements/parity-comfyui-native.txt

      - name: Regenerate native ComfyUI parity report
        shell: bash
        run: |
          .venv-comfy-parity/bin/python -m scripts.run_krea2_comfy_native_parity \
            --comfyui-root .tmp/ComfyUI \
            --output .tmp/krea2_turbo_comfy_native_parity_v1.json

      - name: Verify committed native evidence
        shell: bash
        run: |
          cmp --silent \
            tests/parity/fixtures/krea2_turbo_comfy_native_parity_v1.json \
            .tmp/krea2_turbo_comfy_native_parity_v1.json

      - name: Publish native parity evidence
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # pragma: allowlist secret
        with:
          name: krea2-turbo-comfy-native-parity-python-3.13
          path: .tmp/krea2_turbo_comfy_native_parity_v1.json
          if-no-files-found: warn
          retention-days: 14
