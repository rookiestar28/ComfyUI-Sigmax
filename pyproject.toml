[build-system]
requires = ["setuptools>=80,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-sigmax"
version = "0.1.0.dev0"
description = "Model-aware sigma schedule and sampler tooling for ComfyUI."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.TXT", "NOTICE"]
authors = [
    { name = "rookiestar28" },
]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = [
    "build>=1.5,<1.6",
    "detect-secrets>=1.5,<1.6",
    "mypy>=2.3,<2.4",
    "pre-commit>=4.6,<4.7",
    "pytest>=9.1,<9.2",
    "pytest-cov>=7.1,<7.2",
    "ruff>=0.16,<0.17",
    "tomli>=2.4,<2.5",
]
reference = ["diffusers>=0.39,<0.40"]

[project.urls]
Repository = "https://github.com/rookiestar28/ComfyUI-Sigmax"
Documentation = "https://github.com/rookiestar28/ComfyUI-Sigmax/tree/main/docs"
Issues = "https://github.com/rookiestar28/ComfyUI-Sigmax/issues"

[tool.setuptools]
packages = ["comfyui_sigmax"]
include-package-data = true

[tool.setuptools.package-data]
comfyui_sigmax = ["py.typed"]

[tool.comfy]
PublisherId = "rookiestar28"
DisplayName = "ComfyUI-Sigmax"
requires-comfyui = ">=0.29.0"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["comfyui_sigmax", "tests"]
extend-exclude = [
    ".planning",
    "reference",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]
"tests/*.py" = ["S101", "S603"]
"scripts/run_full_gate.py" = ["S603"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
show_error_codes = true
pretty = true
exclude = [
    "^\\.planning/",
    "^reference/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_config = true
strict_markers = true
addopts = ["-ra"]
markers = [
    "comfyui: requires a supported ComfyUI host",
    "e2e: real-host end-to-end behavior",
    "gpu: requires an approved GPU environment",
    "latest_host: compatibility signal against the latest host",
    "model_weights: requires approved external model weights",
    "mutation: scheduled mutation-testing lane",
    "parity: authoritative numerical parity",
    "slow: intentionally long-running validation",
]

[tool.coverage.run]
branch = true
source = ["comfyui_sigmax"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
]
